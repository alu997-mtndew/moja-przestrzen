name: iOS IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Wersja paczki
        id: version
        shell: bash
        run: |
          version=0.1.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version=${GITHUB_REF_NAME#v}
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Sprawdź archiwum i kopie zapasowe
        run: bash Scripts/check-storage.sh
      - name: Zbuduj niepodpisaną IPA dla iPhone’a
        run: |
          xcodebuild -version
          bash Scripts/build-ipa.sh "${{ steps.version.outputs.value }}" "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: MojaPrzestrzen-IPA
          path: dist/*.ipa
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MojaPrzestrzen-IPA
      - name: Opublikuj wydanie z IPA
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "MojaPrzestrzen-$VERSION.ipa" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Moja przestrzeń $VERSION" --generate-notes
